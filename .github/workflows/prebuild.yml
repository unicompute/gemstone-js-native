name: Prebuild

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install
      - run: npm run build
      - run: npm run verify
      - run: npm pack --json
      - run: node scripts/write-checksums.mjs .node .tgz
      - run: node scripts/verify-checksums.mjs SHA256SUMS.txt
      - run: node scripts/check-prebuild-artifacts.mjs .
      - uses: actions/upload-artifact@v4
        with:
          name: gemstone-js-native-${{ matrix.os }}
          path: |
            *.node
            *.tgz
            SHA256SUMS.txt
